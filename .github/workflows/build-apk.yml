name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platforms and build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "platforms;android-34" \
            "build-tools;35.0.0" "build-tools;34.0.0"

      - name: Install native deps for node-canvas (devDependency)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Create fresh Capacitor Android project (default icons)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore AndroidManifest with camera/location/gallery permissions
        run: cp android-manifest/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Generate Android launcher icons from assets/icon.png
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#001C40'

      - name: Set versionCode/versionName from package.json
        run: |
          cat > /tmp/set-version.mjs <<'EOF'
          import { readFileSync, writeFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const [major, minor, patch] = pkg.version.split('.').map(Number)
          const code = major * 10000 + minor * 100 + patch
          let g = readFileSync('android/app/build.gradle', 'utf8')
          if (!/versionCode \d+/.test(g) || !/versionName "[^"]+"/.test(g)) {
            console.error('build.gradle 里找不到 versionCode/versionName')
            process.exit(1)
          }
          g = g.replace(/versionCode \d+/, `versionCode ${code}`)
          g = g.replace(/versionName "[^"]+"/, `versionName "${pkg.version}"`)
          writeFileSync('android/app/build.gradle', g)
          console.log(`versionCode=${code} versionName=${pkg.version}`)
          EOF
          node /tmp/set-version.mjs
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon --console=plain

      - name: Rename debug APK to 长江现场水印相机v3.1.0-debug
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/长江现场水印相机v3.1.0-debug.apk"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 长江现场水印相机-3.1.0-debug-apk
          path: android/app/build/outputs/apk/debug/长江现场水印相机v3.1.0-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Check release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=""
          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少 release 签名 Secrets:$missing。请按 README《上架应用商店》一节生成 keystore 并填到仓库 Settings → Secrets and variables → Actions，再重新跑构建。"
            exit 1
          fi
          echo "release 签名 Secrets 已齐全"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon --console=plain
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.keystore
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks app/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "app/build/outputs/apk/release/长江现场水印相机v3.1.0.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "app/build/outputs/apk/release/长江现场水印相机v3.1.0.apk"
          rm -f app/release.keystore
          ls -l app/build/outputs/apk/release/

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 长江现场水印相机-3.1.0-release-apk
          path: android/app/build/outputs/apk/release/长江现场水印相机v3.1.0.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release v3.1.0 with signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: 长江现场水印相机 v3.1.0
          files: android/app/build/outputs/apk/release/长江现场水印相机v3.1.0.apk
          fail_on_unmatched_files: true

      - name: Publish APK as base64 chunks (retrieval fallback)
        continue-on-error: true
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          rm -rf /tmp/b64 && mkdir -p /tmp/b64
          split -b 900k "$APK" /tmp/b64/chunk-
          i=0
          for f in /tmp/b64/chunk-*; do
            base64 -w 0 "$f" > "/tmp/b64/part-$(printf '%03d' $i).b64"
            rm "$f"
            i=$((i+1))
          done
          echo "$i" > /tmp/b64/count.txt
          sha256sum "$APK" > /tmp/b64/sha256.txt
          ls -l /tmp/b64
          cd /tmp/b64
          git init -q -b releases-b64
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -qm "APK base64 chunks v3.1.0"
          git push -qf origin releases-b64
